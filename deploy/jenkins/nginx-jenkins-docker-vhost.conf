# Добавьте этот фрагмент в edge-Nginx, уже обслуживающий f1hub.ru.
# Оба контейнера должны состоять в Docker network `f1hub_edge`.

map $http_upgrade $jenkins_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __JENKINS_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __JENKINS_DOMAIN__;

    # Сертификат должен содержать jenkins.f1hub.ru в SAN.
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://f1hub-jenkins:8080;
        proxy_redirect default;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkins_connection_upgrade;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
