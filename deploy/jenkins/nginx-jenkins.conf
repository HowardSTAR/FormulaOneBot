# Шаблон для /etc/nginx/sites-available/jenkins.
# scripts/install-nginx.sh заменяет __JENKINS_DOMAIN__ реальным доменом.

upstream jenkins_backend {
    keepalive 32;
    server 127.0.0.1:8080;
}

# WebSocket используется Jenkins для агентов и интерактивных соединений.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __JENKINS_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` совместим с Nginx из Ubuntu 22.04.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __JENKINS_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__JENKINS_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__JENKINS_DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/jenkins.access.log;
    error_log /var/log/nginx/jenkins.error.log;

    ignore_invalid_headers off;
    client_max_body_size 50m;

    location / {
        sendfile off;
        proxy_pass http://jenkins_backend;
        proxy_redirect default;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
