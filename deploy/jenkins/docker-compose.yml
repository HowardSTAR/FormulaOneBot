name: f1hub-jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JENKINS_IMAGE: ${JENKINS_IMAGE:-jenkins/jenkins:lts-jdk17}
    image: f1hub-jenkins:${JENKINS_IMAGE_TAG:-lts-jdk17}
    container_name: f1hub-jenkins
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    # Jenkins доступен только на loopback. Публичный HTTPS принимает Nginx.
    ports:
      - "127.0.0.1:${JENKINS_HTTP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Moscow}
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=true
        -Djava.awt.headless=true
      JENKINS_OPTS: "--httpPort=8080"
    # GID группы docker на Ubuntu: getent group docker | cut -d: -f3
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in deploy/jenkins/.env}"
    volumes:
      - jenkins_home:/var/jenkins_home
      # ВАЖНО: socket даёт Pipeline фактически root-доступ к Docker-хосту.
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: "${JENKINS_CPUS:-2.0}"
    mem_limit: "${JENKINS_MEMORY:-3g}"
    mem_reservation: "${JENKINS_MEMORY_RESERVATION:-1g}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  jenkins_home:
    name: f1hub_jenkins_home
