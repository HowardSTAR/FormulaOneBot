[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --tb=short --strict-markers --strict-config -W ignore::DeprecationWarning
markers =
    unit: behavior with mocked dependencies or pure functions
    integration: isolated database or ASGI contract checks
    live: opt-in read-only external API checks (requires --live)
    contract: static assets or source architecture contracts
