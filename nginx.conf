# Docker service addresses change when containers are recreated.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream f1hub_public {
    zone f1hub_public 64k;
    server web:8000 resolve;
}
upstream f1hub_preview {
    zone f1hub_preview 64k;
    server web-new:8000 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Query strings contain password-reset tokens; auth paths can contain link tokens.
map $uri $safe_log_path {
    default $uri;
    ~^/api/auth/ /api/auth/redacted;
}
log_format safe_access '$remote_addr - [$time_local] "$request_method $safe_log_path $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log safe_access;

server {
    listen 80;
    server_name f1hub.ru www.f1hub.ru new.f1hub.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/ssl/acme;
    }

    location = /health {
        proxy_pass http://f1hub_public/health;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name f1hub.ru www.f1hub.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://f1hub_public;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Preview uses its own frontend process and host-scoped sessions.
server {
    listen 443 ssl;
    http2 on;
    server_name new.f1hub.ru;

    ssl_certificate /etc/nginx/ssl/new/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/new/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://f1hub_preview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
